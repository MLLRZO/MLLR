<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos com addEventListener</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        main {
            background-color: white;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            background: #0b72b9;
            color: white;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            max-width: 700px;
        }

    </style>
</head>
<body>

    <main>

        <h1>Exemplo 04 - Clique neste título</h1>

        <p>
            O evento de clique está sendo monitorado com addEventListener.
        </p>

    </main>

    <script>

        let titulo = document.querySelector('h1');

        titulo.addEventListener('click', () => {

            window.alert('Pare de clicar no título');
        });

    </script>

</body>
</html>
