<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterando CSS com JavaScript</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        main {
            background-color: white;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .azul {
            color: white;
            background-color: #0b72b9;
            padding: 16px;
            border-radius: 10px;
            border-bottom: 5px solid #063b63;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            margin: 5px;
            cursor: pointer;
            background-color: #0b72b9;
            color: white;
        }

        .botao-inline {
            background-color: #000;
        }

        .botao-limpar {
            background-color: #c0392b;
        }

    </style>
</head>
<body>

    <main>

        <h1>Exemplo 03 - Alterando CSS com JavaScript</h1>

        <button class="botao-inline" onclick="alterarEstiloDireto()">
            Alterar estilo direto inline
        </button>

        <button onclick="aplicarClasse()">
            Aplicar classe azul
        </button>

        <button class="botao-limpar" onclick="removerInline()">
            Remover apenas inline
        </button>

        <button onclick="removerTudo()">
            Remover tudo
        </button>

    </main>

    <script>

        let titulo = document.querySelector('h1');

        function alterarEstiloDireto() {

            titulo.style.color = 'red';
            titulo.style.backgroundColor = '#000';
            titulo.style.padding = '16px';
            titulo.style.borderBottom = 'solid 4px red';
        }

        function aplicarClasse() {

            titulo.setAttribute('class', 'azul');
        }

        function removerInline() {

            titulo.removeAttribute('style');
        }

        function removerTudo() {

            titulo.removeAttribute('class');
            titulo.removeAttribute('style');
        }

    </script>

</body>
</html>
